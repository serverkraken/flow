# Self-contained dev dependencies for flow: Postgres + Dex (OIDC).
# Bring up with `make dev-up`; run flow-server on the host (deploy/dev/README.md).
# Uses podman (no docker CLI on this machine): `podman compose -f ... `.
name: flow-dev
services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
    ports:
      - "5432:5432"
    volumes:
      - flow_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 2s
      timeout: 3s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

volumes:
  flow_dev_pgdata:
