# Self-contained dev dependencies for flow: Postgres + Dex (OIDC).
# Bring up with `make dev-up`; run flow-server on the host (deploy/dev/README.md).
# Uses podman (no docker CLI on this machine): `podman compose -f ... `.
name: flow-dev
services:
  db:
    # Keep the dev major aligned with the CloudNativePG production cluster so
    # current pg_dump archives restore without version-specific SET failures.
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
    ports:
      - "5432:5432"
    volumes:
      - flow_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 2s
      timeout: 3s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  flow_dev_pgdata:
  ollama-data:
